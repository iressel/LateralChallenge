name: cms-sync

x-sql-server-image: &sql-server-image "${SQL_SERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89}"

services:
  sql:
    image: *sql-server-image
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}"
    ports:
      - "127.0.0.1:${SQL_SERVER_PORT:-14333}:1433"
    volumes:
      - cms-sync-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD"
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  db-init:
    image: *sql-server-image
    depends_on:
      sql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}"
      MIGRATION_SQL_PASSWORD: "${MIGRATION_SQL_PASSWORD:?MIGRATION_SQL_PASSWORD is required}"
      WRITE_SQL_PASSWORD: "${WRITE_SQL_PASSWORD:?WRITE_SQL_PASSWORD is required}"
      READ_SQL_PASSWORD: "${READ_SQL_PASSWORD:?READ_SQL_PASSWORD is required}"
    volumes:
      - ./scripts/container:/opt/cms-sync:ro
    entrypoint: ["/bin/bash", "/opt/cms-sync/initialize-database.sh"]
    restart: "no"

  migration:
    build:
      context: .
      target: migration
      args:
        SQL_SERVER_IMAGE: *sql-server-image
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      MIGRATION_SQL_PASSWORD: "${MIGRATION_SQL_PASSWORD:?MIGRATION_SQL_PASSWORD is required}"
    restart: "no"

  api:
    build:
      context: .
      target: api
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__WriteDatabase: >-
        Server=sql,1433;Database=CmsSync;User ID=CmsSyncWriter;
        Password=${WRITE_SQL_PASSWORD:?WRITE_SQL_PASSWORD is required};
        Encrypt=True;TrustServerCertificate=True;Persist Security Info=False
      ConnectionStrings__ReadDatabase: >-
        Server=sql,1433;Database=CmsSync;User ID=CmsSyncReader;
        Password=${READ_SQL_PASSWORD:?READ_SQL_PASSWORD is required};
        Encrypt=True;TrustServerCertificate=True;Persist Security Info=False;
        ApplicationIntent=ReadOnly
      Authentication__Credentials__Cms__Username: "${Authentication__Credentials__Cms__Username:?CMS username is required}"
      Authentication__Credentials__Cms__Password: "${Authentication__Credentials__Cms__Password:?CMS password is required}"
      Authentication__Credentials__Consumer__Username: "${Authentication__Credentials__Consumer__Username:?Consumer username is required}"
      Authentication__Credentials__Consumer__Password: "${Authentication__Credentials__Consumer__Password:?Consumer password is required}"
      Authentication__Credentials__Administrator__Username: "${Authentication__Credentials__Administrator__Username:?Administrator username is required}"
      Authentication__Credentials__Administrator__Password: "${Authentication__Credentials__Administrator__Password:?Administrator password is required}"
    ports:
      - "127.0.0.1:${CMS_API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          IFS= read -r status <&3 && [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

volumes:
  cms-sync-sql-data:
